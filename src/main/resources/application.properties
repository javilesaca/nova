server.port=8091

# --- Modelos: Gemini gratis vía endpoint compatible OpenAI ---
# GEMINI_API_KEY sale de tu cuenta de Google AI Studio (sin tarjeta).
# Arrancar con: GEMINI_API_KEY=tu-clave ./mvnw spring-boot:run
spring.ai.openai.api-key=${GEMINI_API_KEY:}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.options.model=gemini-2.0-flash
spring.ai.openai.embedding.options.model=text-embedding-004

# --- NOVA ---
# Por defecto indexa los proyectos en español del portfolio-astro.
nova.content-dir=${NOVA_CONTENT_DIR:/home/javier/proyectos/portfolio-astro/src/content/projects/es}
nova.store-file=${NOVA_STORE_FILE:/tmp/nova-vectors.json}
nova.top-k=5
nova.similarity-threshold=0.0
